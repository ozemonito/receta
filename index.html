<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stream Chat</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg-main: #0e0e10;
    --bg-panel: #18181b;
    --bg-input: #1f1f23;
    --bg-hover: #26262c;
    --border: #2a2a2e;
    --text-primary: #efeff1;
    --text-secondary: #adadb8;
    --text-muted: #7d7d8e;
    --purple: #9147ff;
    --purple-light: #bf94ff;
    --green: #00c65d;
    --orange: #ff6905;
    --red: #eb0400;
    --yellow: #ffd700;
    --yellow: white;
    --accent: #9147ff;
  }

  body {
    font-family: 'Inter', sans-serif;
    background: var(--bg-main);
    color: var(--text-primary);
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ── LAYOUT ── */
  .app {
    display: flex;
    flex-direction: column;
    height: 100vh;
  }

  .main-area {
    display: flex;
    flex: 1;
    overflow: hidden;
  }

  /* ── VIDEO ── */
  .video-col {
    flex: 1;
    display: flex;
    flex-direction: column;
    background: #000;
    overflow: hidden;
  }

  .video-player {
    flex: 1;
    background: #000;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .video-placeholder {
    width: 100%;
    height: 100%;
    background-image: url("img/rift.webp");
    background-size: cover;
    position: relative;
  }

  .cam {
    position: absolute;
    width: 16rem;
    height: 12rem;
    bottom: 0;
    right: 0;
    background-image: url("img/cam.png");
    background-size: cover;
  }

  /* ── STREAM INFO BAR ── */
  .stream-info-bar {
    background: var(--bg-panel);
    border-top: 1px solid var(--border);
    padding: 10px 16px;
    display: flex;
    align-items: center;
    gap: 12px;
    position: relative;
  }

  .streamer-avatar {
    width: 60px;
    height: 60px;
    border-radius: 50%;
    background-image: url("img/profile.png");
    background-size: cover;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 15px;
    color: #fff;
    flex-shrink: 0;
    border: 2px solid var(--purple);
  }

  .stream-meta {
    flex: 1;
    min-width: 0;
  }

  .streamer-name {
    font-weight: 700;
    font-size: 14px;
    color: var(--text-primary);
    display: flex;
    align-items: center;
    gap: 5px;
  }

  .verified-badge {
    color: var(--purple-light);
    font-size: 13px;
  }

  .stream-title {
    font-size: 12px;
    color: var(--text-secondary);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    margin-top: 2px;
  }

  .stream-tags {
    display: flex;
    gap: 4px;
    align-items: center;
    position: absolute;
    top: 60px;
    left: 80px;
  }

  .tag {
    color: var(--purple-light);
    border-radius: 4px;
    padding: 2px 8px;
    font-size: 11px;
    font-weight: 500;
  }

  .tag-lang {
    background: #53535f7a;
    color: #efeff1;
    border-radius: 0.6rem;
    padding: 2px 8px;
    font-size: 11px;
    font-weight: 500;
  }

  .live-badge {
    background: var(--red);
    color: #fff;
    border-radius: 4px;
    padding: 2px 4px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.3px;
    position: absolute;
    top: 60px;
    left: 7px;
  }

  .stream-actions {
    display: flex;
    gap: 8px;
    align-items: center;
    flex-shrink: 0;
  }

  .btn {
    border: none;
    border-radius: 1rem;
    padding: 7px 14px;
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: opacity .15s;
    white-space: nowrap;
  }
  .btn:hover { opacity: 0.85; }

  .btn-primary { background: var(--purple); color: #fff; }
  .btn-secondary { background: var(--bg-input); color: var(--text-primary); }
  .btn-gift { background: var(--bg-input); color: var(--text-primary); display: flex; align-items: center; gap: 5px; }

  .viewer-count {
    display: flex;
    align-items: center;
    gap: 5px;
    font-size: 13px;
    color: var(--text-secondary);
    white-space: nowrap;
  }
  .viewer-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--red); display: inline-block; }

  /* ── CHAT PANEL ── */
  .chat-panel {
    width: 340px;
    min-width: 280px;
    background: var(--bg-panel);
    border-left: 1px solid var(--border);
    display: flex;
    flex-direction: column;
  }

  .chat-header {
    padding: 10px 14px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .chat-header-left {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .chat-title {
    font-weight: 600;
    font-size: 13px;
    color: var(--text-primary);
  }

  .viewer-badge {
    background: rgba(255,255,255,0.08);
    border-radius: 4px;
    padding: 2px 7px;
    font-size: 12px;
    color: var(--text-secondary);
    display: flex;
    align-items: center;
    gap: 4px;
  }

  .chat-header-right {
    display: flex;
    align-items: center;
    gap: 4px;
  }

  .icon-btn {
    background: none;
    border: none;
    color: var(--text-secondary);
    cursor: pointer;
    padding: 4px;
    border-radius: 4px;
    font-size: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: color .15s, background .15s;
  }
  .icon-btn:hover { color: var(--text-primary); background: var(--bg-hover); }

  /* ── PINNED MESSAGE ── */
  .pinned-msg {
    border-bottom: 1px solid var(--border);
    padding: 8px 14px;
    display: flex;
    align-items: flex-start;
    gap: 8px;
    background: rgba(145,71,255,0.06);
  }

  .pin-icon { font-size: 12px; color: var(--purple-light); margin-top: 2px; flex-shrink: 0; }

  .pinned-content { flex: 1; }

  .pinned-label { font-size: 10px; color: var(--text-muted); margin-bottom: 2px; }
  .pinned-text { font-size: 12px; color: var(--text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* ── MESSAGES ── */
  .chat-messages {
    flex: 1;
    overflow-y: auto;
    padding: 8px 0;
    display: flex;
    flex-direction: column;
    gap: 0;
  }

  .chat-messages::-webkit-scrollbar { width: 6px; }
  .chat-messages::-webkit-scrollbar-track { background: transparent; }
  .chat-messages::-webkit-scrollbar-thumb { background: #3a3a40; border-radius: 3px; }

  .chat-msg {
    padding: 4px 14px;
    line-height: 1.5;
    font-size: 13px;
    transition: background 1s;
    position: relative;
  }
  .chat-msg:hover { background: var(--bg-hover); }

  .msg-header { display: inline; }

  .msg-badges { margin-right: 4px; vertical-align: middle; }

  .badge {
    width: 16px;
    height: 16px;
    margin-right: 3px;
    border-radius: 2px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 9px;
    font-weight: 800;
    vertical-align: middle;
  }
  .badge-mod { background: var(--green); color: #fff; }
  .badge-sub { background: transparent; color: #fff; }
  .badge-bits { background: var(--orange); color: #fff; }
  .badge-star { background: var(--yellow); color: #111; }
  .badge-ciego { background: var(--white); color: #fff; }

  .msg-username {
    font-weight: 700;
    font-size: 13px;
    cursor: pointer;
    white-space: nowrap;
  }
  .msg-username:hover { text-decoration: underline; }

  .msg-colon { color: var(--text-muted); }

  .msg-text { color: var(--text-primary); }
  .msg-text.highlighted { color: var(--yellow); font-style: italic; }

  /* user colors */
  .color-purple { color: rgb(138, 43, 226); }
  .color-orange { color: #ff7043; }
  .color-cyan { color: #26c6da; }
  .color-green { color: #66bb6a; }
  .color-coral { color: #ef5350; }
  .color-teal  { color: #26a69a; }
  .color-blue  { color: #42a5f5; }
  .color-pink  { color: #f436f4; }
  .color-primesock { color: rgb(138, 43, 226); }

  /* reply style */
  .msg-reply {
    border-left: 3px solid var(--border);
    padding-left: 10px;
    margin-bottom: 2px;
    font-size: 11px;
    color: var(--text-muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* ── CHAT INPUT ── */
  .chat-input-area {
    border-top: 1px solid var(--border);
    padding: 10px 12px 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .input-box {
    background: var(--bg-input);
    border: 1px solid var(--border);
    border-radius: 4px;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 10px;
    transition: border-color .15s;
  }
  .input-box:focus-within { border-color: var(--purple); }

  .chat-input {
    flex: 1;
    background: none;
    border: none;
    outline: none;
    color: var(--text-primary);
    font-family: inherit;
    font-size: 13px;
  }
  .chat-input::placeholder { color: var(--text-muted); }

  .emoji-btn {
    background: none;
    border: none;
    font-size: 16px;
    cursor: pointer;
    opacity: 0.7;
    transition: opacity .15s;
    flex-shrink: 0;
  }
  .emoji-btn:hover { opacity: 1; }

  .input-actions {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .chat-points {
    display: flex;
    align-items: center;
    gap: 5px;
    font-size: 12px;
    color: var(--text-secondary);
  }

  .points-icon { font-size: 14px; }

  .send-btn {
    background: var(--purple);
    color: #fff;
    border: none;
    border-radius: 4px;
    padding: 6px 14px;
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: opacity .15s;
  }
  .send-btn:hover { opacity: 0.85; }

  /* ── BOTTOM NAV (stream) ── */
  .bottom-bar {
    background: var(--bg-panel);
    border-top: 1px solid var(--border);
    height: 42px;
    display: flex;
    align-items: center;
    padding: 0 14px;
    gap: 12px;
    font-size: 12px;
    color: var(--text-secondary);
  }

  .stream-stat { display: flex; align-items: center; gap: 5px; color: #efeff1;  }
  .stat-icon { font-size: 13px; }
  .stat-sep { color: var(--border); }

  .bottom-actions { margin-left: auto; display: flex; gap: 8px; }

  .viewer-count-icon {
    fill: #ff8280;
  }

  .share-icon {
    fill: #efeff1;
  }

  .pjs .pj {
    width: 60px;
    height: 60px;
    position: absolute;
    cursor: pointer;
    border-radius: 50%;
    border: 1px solid lightgray;
    overflow: hidden;
    -webkit-box-shadow: 2px 2px 10px 2px #000000;
    box-shadow: 2px 2px 10px 2px #000000;
  }

  .pjs .pj img {
    width: 100%;
    height: 100%;
    display: block;
    object-fit: cover;
    object-position: center center;
    pointer-events: none;
    image-rendering: auto;
  }

  /* sub.png tiene mucho margen transparente alrededor del icono;
     se amplía para que rellene el círculo en vez de dejarlo descentrado */
  .pjs .pj img[src="img/sub.png"] {
    transform: scale(1.15) translateX(8%);
    transform-origin: center center;
  }

  .bright {
    background: rgba(145, 71, 255, 0.4);
    transition: background 1s ease;
  }
</style>
</head>

  ciego: '<span class="badge badge-ciego" title="Solo audio"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-eye-slash" viewBox="0 0 16 16"><path d="M13.359 11.238C15.06 9.72 16 8 16 8s-3-5.5-8-5.5a7 7 0 0 0-2.79.588l.77.771A6 6 0 0 1 8 3.5c2.12 0 3.879 1.168 5.168 2.457A13 13 0 0 1 14.828 8q-.086.13-.195.288c-.335.48-.83 1.12-1.465 1.755q-.247.248-.517.486z"/><path d="M11.297 9.176a3.5 3.5 0 0 0-4.474-4.474l.823.823a2.5 2.5 0 0 1 2.829 2.829zm-2.943 1.299.822.822a3.5 3.5 0 0 1-4.474-4.474l.823.823a2.5 2.5 0 0 0 2.829 2.829"/><path d="M3.35 5.47q-.27.24-.518.487A13 13 0 0 0 1.172 8l.195.288c.335.48.83 1.12 1.465 1.755C4.121 11.332 5.881 12.5 8 12.5c.716 0 1.39-.133 2.02-.36l.77.772A7 7 0 0 1 8 13.5C3 13.5 0 8 0 8s.939-1.721 2.641-3.238l.708.709zm10.296 8.884-12-12 .708-.708 12 12z"/></svg></span>',
};

function renderMessages() {
  const container = document.getElementById("chatMessages");
  document.querySelectorAll(".pj").forEach(el => {
      function pjClickEvent(e) {
        const viewerCountEl = document.querySelector(".viewer-count-number");
        let viewerCount = parseInt(viewerCountEl.innerHTML);
        viewerCount++;
        viewerCountEl.innerHTML = viewerCount;
        const id = el.id;
        const messageToSend = messages.filter(m => m.id === id);
        const messageRender = messageToSend.map(m => {
          const badges = m.badges.map(b => badgeHTML[b] || "").join("");
          const reply = m.reply
            ? `<div class="msg-reply">↩ ${m.reply.to}: ${m.reply.text}</div>`
            : "";
          return `
            <div class="chat-msg bright">
              ${reply}
              <span class="msg-badges">${badges}</span><span class="msg-username ${m.color}">${m.user}</span><span class="msg-colon">: </span><span class="msg-text">${m.text}</span>
            </div>
          `;
        }).join("");
        container.insertAdjacentHTML("beforeend", messageRender);
        container.scrollTop = container.scrollHeight;
        el.style.opacity = 0.4;
        el.style.cursor = "default";
        el.removeEventListener("click", pjClickEvent);
        setTimeout(() => document.querySelector(".bright").classList.remove("bright"), 500);
      }
      el.addEventListener("click", pjClickEvent);
  });
}

function sendMessage() {
  const input = document.getElementById("chatInput");
  const text = input.value.trim();
  if (!text) return;
  messages.push({ user: "Tú", color: "color-blue", badges: [], text });
  input.value = "";
  renderMessages();

}

function setPJs() {
  const placed = [];
  const ITEM_SIZE = 60;
  const PADDING = 20; // margen extra entre elementos

  const container = document.querySelector(".video-placeholder");
  const { width: containerW, height: containerH } = container.getBoundingClientRect();

  // La imagen del mapa tiene un borde decorativo (árboles/rocas) alrededor
  // de la zona de caminos jugable; usamos porcentajes del contenedor para
  // que los márgenes escalen con el tamaño real de la imagen y los iconos
  // caigan dentro de los caminos, no sobre el borde.
  const MARGIN_TOP = containerH * 0.16;
  const MARGIN_LEFT = containerW * 0.15;
  const MARGIN_RIGHT = containerW * 0.14;
  const MARGIN_BOTTOM = containerH * 0.10;

  // zona ocupada por la cam (esquina inferior derecha), con un margen de seguridad
  const cam = document.querySelector(".cam");
  const camRect = cam.getBoundingClientRect();
  const containerRect = container.getBoundingClientRect();
  const CAM_SAFE_MARGIN = 20;
  const camZone = {
    left: (camRect.left - containerRect.left) - CAM_SAFE_MARGIN,
    top: (camRect.top - containerRect.top) - CAM_SAFE_MARGIN,
    right: (camRect.right - containerRect.left) + CAM_SAFE_MARGIN,
    bottom: (camRect.bottom - containerRect.top) + CAM_SAFE_MARGIN,
  };

  function overlapsCam(x, y) {
    return (
      x < camZone.right &&
      x + ITEM_SIZE > camZone.left &&
      y < camZone.bottom &&
      y + ITEM_SIZE > camZone.top
    );
  }

  function generatePosition(containerW, containerH) {
    const maxAttempts = 200;

    const minX = MARGIN_LEFT;
    const maxX = containerW - ITEM_SIZE - MARGIN_RIGHT;
    const minY = MARGIN_TOP;
    const maxY = containerH - ITEM_SIZE - MARGIN_BOTTOM;

    for (let i = 0; i < maxAttempts; i++) {
      const x = minX + Math.random() * Math.max(0, maxX - minX);
      const y = minY + Math.random() * Math.max(0, maxY - minY);

      if (overlapsCam(x, y)) continue;

      const overlapsOther = placed.some(p =>
        Math.abs(p.x - x) < ITEM_SIZE + PADDING &&
        Math.abs(p.y - y) < ITEM_SIZE + PADDING
      );

      if (!overlapsOther) {
        placed.push({ x, y });
        return { x, y };
      }
    }

    return null; // no hay sitio libre
  }

  const pjs = document.querySelectorAll(".pj");
  pjs.forEach(function(el) {
    const pos = generatePosition(containerW, containerH);
    if (!pos) return;
    el.style.left = pos.x + "px";
    el.style.top = pos.y + "px";
  });
}

document.getElementById("chatInput").addEventListener("keydown", e => {
  if (e.key === "Enter") sendMessage();
});

renderMessages();
setPJs();
</script>
